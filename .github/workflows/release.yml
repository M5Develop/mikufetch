name: Update Assets

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Wheel
        run: |
          pip install build
          python -m build

      - name: Install nfpm
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install nfpm

      - name: Build .deb and .rpm
        run: |
          nfpm pkg --packager deb --target dist/
          nfpm pkg --packager rpm --target dist/

      - name: Create Windows Portable Zip
        run: |
          echo "@echo off" > run_miku.bat
          echo "python src/mikufetch/main.py" >> run_miku.bat
          echo "pause" >> run_miku.bat
          zip -r mikufetch-windows.zip src/ run_miku.bat

      - name: Update GitHub Release (v0.1.0)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0 
          files: |
            dist/*
            mikufetch-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
