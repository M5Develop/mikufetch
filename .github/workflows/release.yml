name: Upload Release Assets

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write 

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Wheel
        run: |
          pip install build
          python -m build

      - name: Create Windows Portable Zip
        run: |
          echo "@echo off" > run_miku.bat
          echo "color 0B" >> run_miku.bat
          echo "python src/mikufetch/main.py" >> run_miku.bat
          echo "pause" >> run_miku.bat
          zip -r mikufetch-windows.zip src/ run_miku.bat

      - name: Upload Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            mikufetch-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/